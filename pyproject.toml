[project]
name = "fz-manager-plus"
version = "0.2.0"
description = "Factorio Zone Server Manager"
authors = [
    { name = "michelsciortino", email = "michel.sciortino@outlook.com" },
    { name = "Mesheryakof", email = "danil.spb.it@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0,<0.28.0",
    "certifi>=2021.10.8",
    "websockets>=10.1,<11.0",
    "rich>=14.2.0,<15.0.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "textual>=8.2.8,<9.0.0",
    "textual-fspicker>=1.0.1,<2.0",
]

[project.urls]
repository = "https://github.com/Mesheryakof/FZ-Manager-Plus"

[project.scripts]
fzmp = "fz_manager_plus.cli:main"
fz-manager-plus = "fz_manager_plus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.13,<0.17",
    "isort>=5.13.2,<6.0",
    "textual-dev>=1.7.0,<2.0",
    "commitizen>=4.18.1",
]

[tool.hatch.build.targets.wheel]
packages = ["fz_manager_plus"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["fz_manager_plus"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "pep440"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
bump_message = "build: bump version to $new_version"
