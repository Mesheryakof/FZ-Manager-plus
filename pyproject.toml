[project]
name = "FZ-Manager"
version = "0.1.1"
description = "Factorio Zone Server Manager"
authors = [
    { name = "michelsciortino", email = "michel.sciortino@outlook.com" },
    { name = "Mesheryakof", email = "danil.spb.it@gmail.com" },

]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27.0,<0.28.0",
    "certifi>=2021.10.8",
    "websockets>=10.1,<11.0",
    "rich>=13.3.3,<14.0.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "textual>=0.86.2,<0.87.0",
]

[project.urls]
repository = "https://github.com/Mesheryakof/FZ-Manager"

[project.scripts]
fzm = "fz_manager.cli:main"
fz-manager = "fz_manager.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.13,<0.17",
    "isort>=5.13.2,<6.0",
    "textual-dev>=1.7.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["fz_manager"]
